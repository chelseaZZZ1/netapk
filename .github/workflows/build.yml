name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build APK using Official Kivy Buildozer Docker Image
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/home/user/hostpython \
            kivy/buildozer \
            android debug --allow-root

      - name: Fix permissions for uploaded artifacts
        if: always()
        run: sudo chown -R $USER:$USER .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ff-netcutter-apk
          path: bin/*.apk
