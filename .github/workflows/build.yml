name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout โค้ด
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: ตั้งค่า Python 3.12 (ล็อกเวอร์ชันป้องกัน Python 3.14)
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 3: ติดตั้ง System Dependencies บน Ubuntu 24.04
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libffi-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            openjdk-17-jdk \
            zip \
            unzip \
            ccache

      # Step 4: ติดตั้งและล็อกเวอร์ชัน Toolchain สำคัญ
      - name: Install Buildozer and Pin Toolchain Dependencies
        run: |
          python -m pip install --upgrade "pip<25" "setuptools<70" wheel
          python -m pip install "cython<3" "python-for-android==2024.7.2" "buildozer==1.5.0"

      # Step 5: บิลด์ APK ด้วย Buildozer
      - name: Build APK with Buildozer
        run: |
          rm -rf .buildozer
          buildozer android debug

      # Step 6: Upload APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ff-netcutter-apk
          path: bin/*.apk
