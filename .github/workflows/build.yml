name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build APK using stable Buildozer image
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/home/user/hostpython" \
            -w /home/user/hostpython \
            -e BUILDOZER_WARN_ON_ROOT=0 \
            --entrypoint /bin/bash \
            kivy/buildozer:stable \
            -c "rm -rf .buildozer && yes | buildozer --allow-root android debug"

      - name: Fix file permissions
        if: always()
        run: sudo chown -R "$USER:$USER" .

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ff-netcutter-apk
          path: bin/*.apk
