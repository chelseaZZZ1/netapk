name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build APK with Docker Entrypoint Override
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/home/user/hostpython \
            -e BUILDOZER_ALLOW_ROOT=1 \
            --entrypoint /bin/bash \
            kivy/buildozer \
            -c "/home/user/.venv/bin/buildozer --allow-root android debug"

      - name: Fix file permissions for Runner
        if: always()
        run: sudo chown -R $USER:$USER .

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ff-netcutter-apk
          path: bin/*.apk
