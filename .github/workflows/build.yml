name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Disable Buildozer Root Warning
        run: |
          sed -i 's/warn_on_root = 1/warn_on_root = 0/' buildozer.spec

      - name: Build APK
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/home/user/hostcwd \
            -e BUILDOZER_ALLOW_ROOT=1 \
            kivy/buildozer \
            android debug

      - name: Fix Permissions
        if: always()
        run: |
          sudo chown -R $USER:$USER .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ff-netcutter-apk
          path: bin/*.apk
