name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/home/user/hostcwd \
            -e BUILDOZER_ALLOW_ROOT=1 \
            kivy/buildozer \
            android update

          docker run --rm \
            -v ${{ github.workspace }}:/home/user/hostcwd \
            -e BUILDOZER_ALLOW_ROOT=1 \
            kivy/buildozer \
            android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ff-netcutter-apk
          path: bin/*.apk
