name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout โค้ด
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: ตั้งค่า Python 3.12
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 3: ตั้งค่า Java 17 สำหรับ Gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 4: ติดตั้ง System Dependencies บน Ubuntu 24.04
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libffi-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            zip \
            unzip \
            ccache

      # Step 5: ติดตั้ง Toolchain และ Pin เวอร์ชันที่เข้ากันได้
      - name: Install Buildozer and Pin Toolchain Dependencies
        run: |
          python -m pip install --upgrade "pip<25" "setuptools<70" wheel
          python -m pip install "cython<3" "python-for-android==2024.1.21" "buildozer==1.5.0"

      # Step 6: ลบค่า NDK เดิมของ Runner ออก แล้วสั่งบิลด์ APK
      - name: Build APK with Buildozer
        env:
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_ROOT: ""
        run: |
          rm -rf .buildozer
          buildozer android debug

      # Step 7: Upload APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ff-netcutter-apk
          path: bin/*.apk
