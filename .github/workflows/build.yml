name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout โค้ด
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: ตั้งค่า Python 3.12 (หลีกเลี่ยง Python 3.14 พัง)
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 3: ติดตั้ง System Dependencies สำคัญสำหรับ Android NDK/SDK
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libcreator-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixin-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            openjdk-17-jdk \
            zip \
            unzip \
            ccache

      # Step 4: ล็อกเวอร์ชัน Pip, Setuptools, Cython และ Buildozer/p4a ที่ทำงานเข้ากันได้ 100%
      - name: Install Buildozer and Pin Toolchain Dependencies
        run: |
          python -m pip install --upgrade "pip<25" "setuptools<70" wheel
          python -m pip install "cython<3" "python-for-android==2024.7.2" "buildozer==1.5.0"

      # Step 5: สั่งบิลด์ APK (ไม่ต้องใช้ Docker และไม่ต้องสู้กับปัญหา Root)
      - name: Build APK with Buildozer
        run: |
          rm -rf .buildozer
          buildozer android debug

      # Step 6: Upload APK Artifact ขึ้น GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ff-netcutter-apk
          path: bin/*.apk
